name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements-dev.txt

      - name: Code formatting & lint check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite
        run: |
          pytest -v tests/

  docker-smoke-test:
    name: Container Build & Security Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t nmt-service:smoke .

      - name: Verify non-root execution
        run: |
          USER_ID=$(docker run --rm --entrypoint id nmt-service:smoke -u)
          echo "Container user ID: $USER_ID"
          if [ "$USER_ID" != "10001" ]; then
            echo "Security violation: Container is not running as non-root UID 10001!"
            exit 1
          fi

      - name: Run container & verify healthz
        run: |
          docker run -d --name nmt-smoke-container -p 8000:8000 -e FAIL_FAST_STARTUP=false nmt-service:smoke

          # Resilient polling loop for container liveness
          SUCCESS=0
          for i in {1..15}; do
            if python3 -c "import urllib.request; res = urllib.request.urlopen('http://localhost:8000/healthz'); assert res.status == 200; print('Healthz OK:', res.read().decode())"; then
              SUCCESS=1
              break
            fi
            echo "Waiting for container to accept connections (attempt $i/15)..."
            sleep 1
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Container health check failed. Dumping logs:"
            docker logs nmt-smoke-container
            exit 1
          fi

          docker stop nmt-smoke-container

      - name: Scan container image with Trivy for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nmt-service:smoke'
          format: 'table'
          severity: 'CRITICAL,HIGH'
