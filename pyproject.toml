[project]
name = "english-spanish-nmt-marianmt"
version = "1.0.0"
description = "Production-grade English-to-Spanish NMT microservice with CTranslate2 INT8"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ctranslate2>=4.8.0",
    "sentencepiece>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "prometheus-client>=0.20.0",
    "anyio>=4.4.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.ipynb",
    "Prompt",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "strict"
python_files = ["test_*.py"]
