services:
  translation-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: nmt-opus-en-es:latest
    container_name: nmt-opus-en-es-prod
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/models/opus-mt-en-es-ct2-int8
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - INTRA_THREADS=4
      - INTER_THREADS=1
      - BATCH_SIZE=32
      - MAX_WAIT_MS=10.0
      - LOG_LEVEL=INFO
      - ENABLE_METRICS=true
      - ENVIRONMENT=production
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
