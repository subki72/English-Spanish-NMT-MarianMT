apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmt-service
  namespace: default
  labels:
    app: nmt-service
    app.kubernetes.io/name: nmt-service
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: english-spanish-nmt
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nmt-service
  template:
    metadata:
      labels:
        app: nmt-service
        app.kubernetes.io/name: nmt-service
        app.kubernetes.io/component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nmt-service
          image: nmt-opus-en-es:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_DIR
              value: "/app/models/opus-mt-en-es-ct2-int8"
            - name: FAIL_FAST_STARTUP
              value: "true"
            - name: DEVICE
              value: "cpu"
            - name: COMPUTE_TYPE
              value: "int8"
            - name: INTRA_THREADS
              value: "4"
            - name: INTER_THREADS
              value: "1"
            - name: BATCH_SIZE
              value: "32"
            - name: MAX_WAIT_MS
              value: "10.0"
            - name: RATE_LIMIT_REQUESTS
              value: "60"
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ENABLE_METRICS
              value: "true"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
